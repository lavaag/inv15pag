    <script>
      // Safety guard for environments/iframes where window.fetch has only a getter
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _f; },
            set: function(v) { _f = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
