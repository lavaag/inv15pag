<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Rose Velvet -->
    <linearGradient id="xvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5370" />
      <stop offset="50%" stop-color="#693952" />
      <stop offset="100%" stop-color="#4e243b" />
    </linearGradient>

    <!-- Metallic Champagne & Rose Gold Gradient -->
    <linearGradient id="xvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc" />
      <stop offset="30%" stop-color="#f5d591" />
      <stop offset="60%" stop-color="#e3b664" />
      <stop offset="85%" stop-color="#c99138" />
      <stop offset="100%" stop-color="#faecc8" />
    </linearGradient>

    <!-- Inner Glow & Drop Shadow -->
    <filter id="xvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1a0612" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Medal Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#xvBg)" stroke="url(#xvGold)" stroke-width="4.5" />
  
  <!-- Inner Delicate Dotted Gold Filigree -->
  <rect x="11" y="11" width="106" height="106" rx="21" fill="none" stroke="url(#xvGold)" stroke-width="1.5" stroke-dasharray="4 2.5" opacity="0.8" />

  <!-- Tiny Princess Tiara / Crown Accent above "XV" -->
  <g transform="translate(64, 28) scale(0.72)" filter="url(#xvShadow)">
    <path d="M-22,10 L-26,0 L-11,5 L0,-8 L11,5 L26,0 L22,10 Z" fill="url(#xvGold)" />
    <!-- Jewels on crown -->
    <circle cx="0" cy="-9" r="2.2" fill="#ffffff" />
    <circle cx="-26" cy="-1.5" r="1.6" fill="#ffffff" />
    <circle cx="26" cy="-1.5" r="1.6" fill="#ffffff" />
  </g>

  <!-- Luxury Serif Monogram "XV" -->
  <g filter="url(#xvShadow)">
    <text x="64" y="94"
          font-family="'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Times New Roman', serif"
          font-size="52"
          font-weight="700"
          letter-spacing="2.5"
          fill="url(#xvGold)"
          text-anchor="middle">XV</text>
  </g>
</svg>
